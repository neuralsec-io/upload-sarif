[tools]
go = "1.25.6"
prek = "0.3.1"
"ubi:golangci/golangci-lint" = "latest"
"ubi:goreleaser/goreleaser" = "latest"
"ubi:gotestyourself/gotestsum" = "latest"
# Used only by .github/workflows/upgrade-deps.yml. Pinned here rather than in
# the workflow so Renovate's mise manager keeps its own version current.
#
# trust_policy_excludes: installing Renovate trips mise's no-downgrade trust
# policy on a transitive dependency —
#   @yarnpkg/libzip@3.2.2 ... earlier published version 3.2.0 had provenance
#   attestation but this version has no trust evidence
# Checked against npm before excluding: 3.2.0 and 3.2.1 carry SLSA provenance
# and were published by `yarnbot`; 3.2.2 has no attestation and was published by
# `arcanis`, the Yarn lead, from the same yarnpkg/berry repo. That is a manual
# publish outside the release workflow, not evidence of tampering. The exclude
# is pinned to that exact version so any other package — or any later libzip —
# still trips the policy.
"npm:renovate" = { version = "44.26.0", trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }

[tasks.format]
run = "golangci-lint fmt"
description = "Format code"

[tasks.lint]
run = "golangci-lint run"
description = "Run lint tools"

[tasks.install]
run = "go mod download"
description = "Download dependencies"

[tasks.freeze]
run = "go mod tidy && go mod verify"
description = "Freeze dependencies"

[tasks."freeze:upgrade"]
run = "go get -u ./... && go mod tidy && go mod verify"
description = "Upgrade dependencies"

[tasks.test]
run = "gotestsum --format testdox --format-hide-empty-pkg ./..."
description = "Run tests"

[tasks.snapshot]
run = "goreleaser build --clean --snapshot --single-target -o \"dist/upload-sarif\""
description = "Build binary in snapshot mode"
