name: CI setup
description: >-
  Shared CI preamble for this repo: the mise toolchain plus the Go module and
  build caches, so every job resolves tools from one pinned source.

  Being a local composite action, it CANNOT check out the repository — the
  runner has to read this file out of the workspace first. Callers run
  actions/checkout themselves and then `uses: ./.github/actions/ci-setup`.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      with:
        install: true
        cache: true

    # run_id in the key: cache entries are immutable, so a fixed key would never
    # pick up newly compiled packages. restore-keys falls back to the last one.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}-
          go-${{ runner.os }}-${{ runner.arch }}-
