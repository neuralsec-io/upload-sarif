name: CI setup
description: >-
  mise toolchain plus Go module/build caches. Local action, so callers must
  run actions/checkout before it.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      with:
        install: true
        cache: true

    # run_id: cache entries are immutable, so a fixed key never updates.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}-
          go-${{ runner.os }}-${{ runner.arch }}-
