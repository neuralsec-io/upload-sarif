name: Release

# workflow_call only. A `push: tags` trigger would double-run this workflow:
# release-please tags with the App token, whose pushes (unlike GITHUB_TOKEN's)
# do start workflows, and release-please.yml already chains here explicitly.
on:
  workflow_call:

  # Rebuild the assets of a tag that already exists. Release assets do not
  # survive a repository recreate, and they cannot be rebuilt locally: action.yml
  # verifies checksums.txt against a signer identity of
  # release.yml@refs/(heads/main|tags/.+), which only a run of this workflow can
  # produce. Dispatch is on main because tags older than this trigger have no
  # workflow_dispatch in their own copy of the file; the checkout below moves to
  # the requested tag, and refs/heads/main satisfies that identity regexp.
  #
  # This does not double-run releases the way a `push: tags` trigger would — it
  # only fires when asked.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild assets for, e.g. v2.0.4"
        required: true
        type: string
      include_docker:
        description: "Also rebuild and push the ghcr image (off by default: a rebuild should not move published image tags onto new digests)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # needed to write releases
  id-token: write # needed for keyless signing
  packages: write # needed for ghcr access

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Empty for workflow_call, so this keeps the triggering commit.
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # A rebuild skips Docker by default: ghcr images survive a repository
          # recreate, so re-pushing them would only move published tags onto new
          # digests. Only the release assets need restoring. include_docker is
          # the escape hatch for when the image itself has to be republished.
          args: release --clean ${{ (inputs.tag && !inputs.include_docker) && '--skip=docker' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
