name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    # No GITHUB_TOKEN scope at all: the App token below does every write.
    # GITHUB_TOKEN cannot open the release PR here — this repo is public and
    # sets can_approve_pull_request_reviews = false (see the infrastructure
    # repo), so Actions is barred from creating pull requests.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: 1988247
          private-key: ${{ secrets.UPGRADE_DEPENDENCIES_BOT_PEM }}
          owner: neuralsec-io
          repositories: upload-sarif

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Chained, never tag-triggered. release-please now tags with the App token,
  # and App-token pushes DO start workflows — so release.yml's `push: tags`
  # trigger was removed in the same change. Without that removal a release
  # would run twice: once from the tag push, once from this chained call.
  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write # write release assets
      id-token: write # keyless cosign signing
      packages: write # push to ghcr
    secrets: inherit
    uses: ./.github/workflows/release.yml

  major-tag:
    needs: [release-please, goreleaser]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Move floating major tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: v${{ needs.release-please.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"
