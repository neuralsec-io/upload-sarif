name: Upgrade deps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-5"

permissions: {}

concurrency:
  group: upgrade-deps
  cancel-in-progress: false

jobs:
  renovate:
    # Renovate is invoked directly on a GitHub-hosted runner rather than through
    # a shared workflow. Update policy is still centralised — it comes from the
    # preset referenced in .github/renovate.json — so only the runner is local.
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; Renovate authenticates as the App below
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: 1988247
          private-key: ${{ secrets.UPGRADE_DEPENDENCIES_BOT_PEM }}
          owner: neuralsec-io
          # Narrowed to only the repositories this run needs, rather than the
          # App's full installation scope: the repo being updated, plus the one
          # holding the preset that Renovate resolves over the API.
          repositories: |
            upload-sarif
            upgrade-deps

      # persist-credentials: false — otherwise actions/checkout leaves an
      # Authorization header wired in via includeIf.gitdir, scoped to this repo,
      # which git would send in preference to Renovate's own credentials for any
      # datasource that shells out to git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Provides go (for go.sum updates) and renovate itself, both pinned in
      # mise.toml, so Renovate can keep its own version current.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: false

      - name: Run Renovate
        env:
          RENOVATE_BINARY_SOURCE: global # tools come from mise, not containerbase
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_PLATFORM_COMMIT: "enabled" # commits signed by the App
          RENOVATE_CONFIG_FILE: .github/renovate.json
          RENOVATE_TOKEN: ${{ steps.token.outputs.token }}
        # node@24 rather than whatever the runner image ships: renovate 44
        # declares `node ^24.11.0`, and ubuntu-latest is already past that.
        run: mise exec node@24 -- renovate
