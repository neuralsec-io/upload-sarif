name: Upgrade deps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-5"

permissions: {}

concurrency:
  group: upgrade-deps
  cancel-in-progress: false

jobs:
  renovate:
    # This repo is public, so it must not run on the org's self-hosted fleet:
    # a public repo's workflows are a far broader attack surface than a private
    # one's. That also rules out the shared upgrade-deps-reusable.yml, which
    # depends on the runs-on S3 cache and the AWS role that exist only on that
    # fleet. Renovate is therefore invoked directly here — the config itself
    # still comes from the shared preset via .github/renovate.json, so policy
    # stays centralised even though the runner does not.
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; Renovate authenticates as the App below
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: 1988247
          private-key: ${{ secrets.UPGRADE_DEPENDENCIES_BOT_PEM }}
          owner: neuralsec-io
          # Narrowed to the two repos actually needed, rather than the App's
          # full org-wide installation scope that the other callers inherit —
          # this token is minted in a public repo. upload-sarif is the repo
          # being updated; upgrade-deps is required because Renovate resolves
          # the shared preset in .github/renovate.json over the API with this
          # same token, and that repo is private.
          repositories: |
            upload-sarif
            upgrade-deps

      # persist-credentials: false — otherwise actions/checkout leaves an
      # Authorization header wired in via includeIf.gitdir, scoped to this repo,
      # which git would send in preference to Renovate's own credentials for any
      # datasource that shells out to git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Provides go (for go.sum updates) and renovate itself, both pinned in
      # mise.toml, so Renovate can keep its own version current.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: false

      - name: Run Renovate
        env:
          RENOVATE_BINARY_SOURCE: global # tools come from mise, not containerbase
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_PLATFORM_COMMIT: "enabled" # commits signed by the App
          RENOVATE_CONFIG_FILE: .github/renovate.json
          RENOVATE_TOKEN: ${{ steps.token.outputs.token }}
        # node@24 rather than whatever the runner image ships: renovate 44
        # declares `node ^24.11.0`, and ubuntu-latest is already past that.
        # Same approach as the shared upgrade-deps-reusable.yml.
        run: mise exec node@24 -- renovate
