name: Upgrade deps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-5"

permissions: {}

concurrency:
  group: upgrade-deps
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; Renovate authenticates as the App below
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: 1988247
          private-key: ${{ secrets.UPGRADE_DEPENDENCIES_BOT_PEM }}
          owner: neuralsec-io
          repositories: |
            upload-sarif
            upgrade-deps

      # persist-credentials: false — otherwise checkout's header overrides
      # Renovate's git credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: false

      - name: Run Renovate
        env:
          RENOVATE_BINARY_SOURCE: global # tools come from mise, not containerbase
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_PLATFORM_COMMIT: "enabled" # commits signed by the App
          RENOVATE_CONFIG_FILE: .github/renovate.json
          RENOVATE_TOKEN: ${{ steps.token.outputs.token }}
        # renovate 44 requires node ^24.11.0; the runner image ships newer.
        run: mise exec node@24 -- renovate
